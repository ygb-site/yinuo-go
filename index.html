<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo/logo-avatar-circle.svg" />
    <link rel="apple-touch-icon" href="/logo/logo-avatar-circle-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS Safari 至今只认 apple- 前缀这一版，需与上面的标准写法并存 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="一诺未来学堂" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#F97316" />
    
    <!-- 优化 Google Fonts 异步非阻塞加载，防止国内网络卡白屏 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Quicksand:wght@600;700;800&family=ZCOOL+KuaiLe&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Quicksand:wght@600;700;800&family=ZCOOL+KuaiLe&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Quicksand:wght@600;700;800&family=ZCOOL+KuaiLe&display=swap" />
    </noscript>

    <title>一诺未来学堂 (YiNuo Academy) - 少儿全科智趣启蒙世界</title>
    <meta name="description" content="专为 4~10 岁少儿定制的多元全科互动智趣启蒙世界，涵盖围棋博弈、数理口算、国学语文与自然拼读英语。" />
    <!-- GitHub Pages SPA 路由重定向还原脚本（支持无 # 号 HTML5 History 模式） -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
