<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="warmSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>

    <radialGradient id="blackStone3" cx="32%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <radialGradient id="whiteStone3" cx="30%" cy="26%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </radialGradient>

    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#FF7A00" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="960" height="960" rx="224" ry="224" fill="url(#emblemBg)" />
  
  <!-- Outer Warm Sunburst Ring -->
  <circle cx="512" cy="512" r="410" fill="none" stroke="url(#warmSun)" stroke-width="16" filter="url(#emblemGlow)" />
  
  <!-- Bamboo Wood Board Center Circle -->
  <circle cx="512" cy="512" r="380" fill="#FDFBF7" />

  <!-- Board Grid Lines -->
  <g opacity="0.3" stroke="#92400E" stroke-width="5" stroke-linecap="round">
    <line x1="232" y1="372" x2="792" y2="372" />
    <line x1="192" y1="512" x2="832" y2="512" />
    <line x1="232" y1="652" x2="792" y2="652" />
    <line x1="372" y1="232" x2="372" y2="792" />
    <line x1="512" y1="192" x2="512" y2="832" />
    <line x1="652" y1="232" x2="652" y2="792" />
    <circle cx="372" cy="372" r="10" fill="#92400E" />
    <circle cx="652" cy="372" r="10" fill="#92400E" />
    <circle cx="372" cy="652" r="10" fill="#92400E" />
    <circle cx="652" cy="652" r="10" fill="#92400E" />
    <circle cx="512" cy="512" r="12" fill="#92400E" />
  </g>

  <!-- Panda Ears on Top of Board -->
  <g transform="translate(512, 512)">
    <circle cx="-190" cy="-280" r="70" fill="#0F172A" />
    <circle cx="-190" cy="-280" r="40" fill="#FF7A00" opacity="0.7" />
    <circle cx="190" cy="-280" r="70" fill="#0F172A" />
    <circle cx="190" cy="-280" r="40" fill="#FF7A00" opacity="0.7" />
  </g>

  <!-- Dynamic Yin-Yang Weiqi Stones & 'Y' Motif -->
  <g transform="translate(512, 512)">
    <!-- Interlocking Black & White S-Curve Stones -->
    <!-- Black Stone Half -->
    <g transform="translate(-100, -30)">
      <circle cx="0" cy="0" r="140" fill="url(#blackStone3)" stroke="#334155" stroke-width="5" />
      <ellipse cx="-45" cy="-50" rx="36" ry="18" transform="rotate(-30, -45, -50)" fill="#FFFFFF" fill-opacity="0.55" />
      <!-- Eyes inside Black Stone (Panda Face subtlety) -->
      <circle cx="0" cy="0" r="22" fill="#FFFFFF" />
      <circle cx="4" cy="-4" r="8" fill="#0F172A" />
    </g>

    <!-- White Stone Half -->
    <g transform="translate(100, 30)">
      <circle cx="0" cy="0" r="140" fill="url(#whiteStone3)" stroke="#FFFFFF" stroke-width="6" />
      <ellipse cx="-40" cy="-45" rx="40" ry="22" transform="rotate(-30, -40, -45)" fill="#FFFFFF" fill-opacity="0.9" />
      <!-- Dot inside White Stone -->
      <circle cx="0" cy="0" r="22" fill="#0F172A" />
      <circle cx="-4" cy="-4" r="8" fill="#FFFFFF" />
    </g>

    <!-- Golden Star Sparkle in Center -->
    <circle cx="0" cy="0" r="45" fill="url(#warmSun)" stroke="#FFFFFF" stroke-width="6" />
    <path d="M 0 -26 L 8 -9 L 26 -8 L 13 4 L 17 21 L 0 12 L -17 21 L -13 4 L -26 -8 L -8 -9 Z" fill="#FFFFFF" />
  </g>

  <!-- Bottom Brand Text -->
  <text x="512" y="870" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="52" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="6">一诺弈学</text>
</svg>