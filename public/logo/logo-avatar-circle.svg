<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="circleBg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFBF5" />
      <stop offset="65%" stop-color="#FFE8D1" />
      <stop offset="100%" stop-color="#FFD6A5" />
    </radialGradient>
    
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#FF9E2C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="headGrad2" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="blackEarGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>

    <radialGradient id="eyeShine2" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="80%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <radialGradient id="blackStone2" cx="32%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="30%" stop-color="#334155" />
      <stop offset="75%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <radialGradient id="whiteStone2" cx="30%" cy="26%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F1F5F9" />
      <stop offset="85%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </radialGradient>

    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="shadowPop2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#7C2D12" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Outer Ring with Gradient -->
  <circle cx="512" cy="512" r="500" fill="url(#ringGrad)" />
  <circle cx="512" cy="512" r="460" fill="url(#circleBg)" stroke="#FFFFFF" stroke-width="12" />

  <!-- Subtle Board Grid -->
  <g transform="translate(512, 512)" opacity="0.25" stroke="#A16207" stroke-width="4" stroke-linecap="round">
    <line x1="-300" y1="-120" x2="300" y2="-120" />
    <line x1="-340" y1="0" x2="340" y2="0" />
    <line x1="-300" y1="120" x2="300" y2="120" />
    <line x1="-120" y1="-300" x2="-120" y2="300" />
    <line x1="0" y1="-340" x2="0" y2="340" />
    <line x1="120" y1="-300" x2="120" y2="300" />
    <circle cx="-120" cy="-120" r="8" fill="#A16207" stroke="none" />
    <circle cx="120" cy="-120" r="8" fill="#A16207" stroke="none" />
    <circle cx="0" cy="0" r="10" fill="#A16207" stroke="none" />
  </g>

  <!-- Mascot Center Stage -->
  <g transform="translate(512, 490)">
    <!-- Ears -->
    <ellipse cx="-210" cy="-210" rx="90" ry="85" transform="rotate(-22, -210, -210)" fill="url(#blackEarGrad2)" />
    <ellipse cx="-210" cy="-210" rx="55" ry="50" transform="rotate(-22, -210, -210)" fill="#FB7185" opacity="0.5" />
    <ellipse cx="210" cy="-210" rx="90" ry="85" transform="rotate(22, 210, -210)" fill="url(#blackEarGrad2)" />
    <ellipse cx="210" cy="-210" rx="55" ry="50" transform="rotate(22, 210, -210)" fill="#FB7185" opacity="0.5" />

    <!-- Head -->
    <ellipse cx="0" cy="-50" rx="270" ry="235" fill="url(#headGrad2)" filter="url(#shadowPop2)" />

    <!-- Headband -->
    <path d="M -255 -130 Q 0 -185 255 -130 Q 260 -90 250 -80 Q 0 -135 -250 -80 Z" fill="#EF4444" />
    <!-- Headband Star Emblem -->
    <circle cx="0" cy="-138" r="34" fill="url(#goldGrad2)" stroke="#FFFFFF" stroke-width="4" />
    <path d="M 0 -158 L 7 -145 L 20 -143 L 10 -133 L 13 -119 L 0 -127 L -13 -119 L -10 -133 L -20 -143 L -7 -145 Z" fill="#FFFFFF" />

    <!-- Eye Patches -->
    <ellipse cx="-115" cy="-55" rx="78" ry="65" transform="rotate(-18, -115, -55)" fill="#1E293B" />
    <ellipse cx="115" cy="-55" rx="78" ry="65" transform="rotate(18, 115, -55)" fill="#1E293B" />

    <!-- Big Catchlight Eyes -->
    <circle cx="-105" cy="-55" r="40" fill="url(#eyeShine2)" />
    <circle cx="-118" cy="-68" r="16" fill="#FFFFFF" />
    <circle cx="-90" cy="-45" r="8" fill="#FFFFFF" />

    <circle cx="105" cy="-55" r="40" fill="url(#eyeShine2)" />
    <circle cx="92" cy="-68" r="16" fill="#FFFFFF" />
    <circle cx="120" cy="-45" r="8" fill="#FFFFFF" />

    <!-- Nose & Smile -->
    <ellipse cx="0" cy="10" rx="22" ry="15" fill="#0F172A" />
    <path d="M -30 32 Q 0 58 30 32" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round" />
    <path d="M -16 40 Q 0 62 16 40 Z" fill="#F43F5E" />

    <!-- Cheeks -->
    <ellipse cx="-180" cy="2" rx="42" ry="26" fill="#FB7185" opacity="0.65" />
    <ellipse cx="180" cy="2" rx="42" ry="26" fill="#FB7185" opacity="0.65" />

    <!-- Paws Hugging Go Stones -->
    <ellipse cx="-200" cy="150" rx="65" ry="56" transform="rotate(25, -200, 150)" fill="#1E293B" />
    <ellipse cx="200" cy="150" rx="65" ry="56" transform="rotate(-25, 200, 150)" fill="#1E293B" />

    <!-- 3D Black & White Stones in Center -->
    <g transform="translate(-95, 175)">
      <ellipse cx="0" cy="72" rx="115" ry="38" fill="#000000" opacity="0.3" filter="url(#shadowPop2)" />
      <circle cx="0" cy="0" r="130" fill="url(#blackStone2)" stroke="#334155" stroke-width="4" />
      <ellipse cx="-45" cy="-48" rx="34" ry="18" transform="rotate(-30, -45, -48)" fill="#FFFFFF" fill-opacity="0.55" />
    </g>

    <g transform="translate(95, 185)">
      <ellipse cx="0" cy="70" rx="115" ry="38" fill="#000000" opacity="0.25" filter="url(#shadowPop2)" />
      <circle cx="0" cy="0" r="130" fill="url(#whiteStone2)" stroke="#FFFFFF" stroke-width="6" />
      <ellipse cx="-40" cy="-45" rx="38" ry="22" transform="rotate(-30, -40, -45)" fill="#FFFFFF" fill-opacity="0.9" />
    </g>

    <!-- Star Gem Badge -->
    <circle cx="0" cy="175" r="40" fill="url(#goldGrad2)" stroke="#FFFFFF" stroke-width="6" filter="url(#shadowPop2)" />
    <path d="M 0 152 L 7 167 L 23 168 L 11 179 L 15 194 L 0 185 L -15 194 L -11 179 L -23 168 L -7 167 Z" fill="#FFFFFF" />
  </g>
</svg>