<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌟 快乐六角跳棋 (少儿益智版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-ring {
      animation: pulse-ring 1.5s infinite ease-in-out;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Quick Actions -->
    <div class="flex items-center gap-2">

      <button id="btnRestart" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white border border-white/10 active:scale-95 transition-all" title="重新开始">

      <button id="btnRules" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white border border-white/10 active:scale-95 transition-all" title="玩法秘籍">

      <button id="btnSound" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white border border-white/10 active:scale-95 transition-all">

  <!-- Main Game Container -->
  <main class="flex-1 flex flex-col lg:flex-row items-center justify-center p-2 sm:p-4 gap-4 max-w-7xl mx-auto w-full">
    <!-- Left Sidebar: Modes & Info -->

      <!-- Controls & Turn Info -->

        <!-- Puzzle Level Selector -->

        <!-- Current Player Turn Card -->

        <!-- Goal Progress -->

            <div class="bg-white/5 rounded-xl p-2 flex items-center justify-between border border-white/5">

    <!-- Center Board Area -->
    <section class="flex-1 flex flex-col items-center justify-center relative w-full order-1 lg:order-2">
      <div class="relative w-full max-w-[620px] aspect-square flex items-center justify-center p-1 sm:p-2">
        <svg id="boardSvg" viewBox="0 0 700 700" class="w-full h-full drop-shadow-2xl select-none">
          <defs>
            <radialGradient id="grad_1" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
              <stop offset="25%" stop-color="#f87171" />
              <stop offset="70%" stop-color="#ef4444" />
              <stop offset="100%" stop-color="#991b1b" />
            </radialGradient>
            <radialGradient id="grad_2" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
              <stop offset="25%" stop-color="#60a5fa" />
              <stop offset="70%" stop-color="#3b82f6" />
              <stop offset="100%" stop-color="#1e3a8a" />
            </radialGradient>
            <filter id="drop_shadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />

          </defs>

          <!-- Board Background -->
          <circle cx="350" cy="350" r="340" fill="#0f172a" stroke="#38bdf8" stroke-width="4" opacity="0.95" />
          <circle cx="350" cy="350" r="330" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />

          <!-- Camps Tints -->
          <polygon points="350,126 434,272 266,272" fill="rgba(59, 130, 246, 0.25)" />
          <polygon points="350,574 434,428 266,428" fill="rgba(239, 68, 68, 0.25)" />
          <polygon points="574,254 490,400 490,254" fill="rgba(16, 185, 129, 0.25)" />
          <polygon points="126,446 210,300 210,446" fill="rgba(245, 158, 11, 0.25)" />
          <polygon points="574,446 490,446 490,300" fill="rgba(236, 72, 153, 0.25)" />
          <polygon points="126,254 210,254 210,400" fill="rgba(168, 85, 247, 0.25)" />

      <!-- Quick Guidance Banner -->

  <!-- Victory Modal -->
  <div id="victoryModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900 border-2 border-amber-400 rounded-3xl p-6 max-w-md w-full text-center shadow-2xl flex flex-col items-center">
      <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-amber-400 to-yellow-200 flex items-center justify-center text-4xl mb-4 animate-bounce">

      </div>

      <p id="victoryDesc" class="text-slate-300 text-sm mb-6">恭喜率先把所有弹珠移入目标大本营！</p>
      <button onclick="restartGame()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-black text-base shadow-lg active:scale-95 transition-all">

  <!-- Rules Modal -->
  <div id="rulesModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-white/20 rounded-3xl p-6 max-w-md w-full shadow-2xl flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-4">
        <h3 class="text-lg font-black text-white flex items-center gap-2">📖 跳棋玩法秘籍</h3>
        <button onclick="document.getElementById('rulesModal').classList.add('hidden')" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div class="space-y-3 text-xs text-slate-300">
        <div class="p-3 bg-white/5 rounded-xl border border-white/10">
          <strong class="text-blue-300">1. 单步走：</strong> 向相邻6个方向的任意空位走1格。
        </div>
        <div class="p-3 bg-white/5 rounded-xl border border-white/10">
          <strong class="text-amber-300">2. 飞跃跳：</strong> 前方有子且后方为空，即可直接跳过它！
        </div>
        <div class="p-3 bg-white/5 rounded-xl border border-white/10">
          <strong class="text-emerald-300">3. 连续跳（搭桥）：</strong> 跳过一个子后若还能跳，可一回合连续跳跃横跨棋盘！
        </div>
        <div class="p-3 bg-white/5 rounded-xl border border-white/10">
          <strong class="text-purple-300">4. 胜利：</strong> 先把全部10颗弹珠运至正对面大本营者获胜！
        </div>
      </div>
      <button onclick="document.getElementById('rulesModal').classList.add('hidden')" class="mt-5 py-2.5 rounded-xl bg-blue-600 font-bold text-white shadow-lg">
        我明白了，开始对局！
      </button>
    </div>
  </div>

  <script>
    // Audio Synthesizer
    class Sound {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      select() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        const t = this.ctx.currentTime;
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.08);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.09);
      }
      step() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        const t = this.ctx.currentTime;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(784, t);
        osc.frequency.exponentialRampToValueAtTime(1046, t + 0.06);
        g.gain.setValueAtTime(0.25, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.13);
      }
      hop(hopIdx = 1) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
        const freq = scale[Math.min(hopIdx - 1, scale.length - 1)];
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        const t = this.ctx.currentTime;
        osc.frequency.setValueAtTime(freq * 0.7, t);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.3, t + 0.06);
        osc.frequency.exponentialRampToValueAtTime(freq, t + 0.14);
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.17);
      }
      victory() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const notes = [392, 523.25, 659.25, 783.99, 1046.5];
        notes.forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          const t = this.ctx.currentTime + i * 0.12;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, t);
          g.gain.setValueAtTime(0.25, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
          osc.connect(g); g.connect(this.ctx.destination);
          osc.start(t); osc.stop(t + 0.26);
        });
      }
    }
    const sound = new Sound();

    // 121 Board Nodes Setup
    const ROW_SIZES = [1, 2, 3, 4, 13, 12, 11, 10, 9, 10, 11, 12, 13, 4, 3, 2, 1];
    const NODES = [];
    const NODE_MAP = {};
    for (let r = 0; r < 17; r++) {
      const n = ROW_SIZES[r];
      for (let c = 0; c < n; c++) {
        const x = c - (n - 1) / 2;
        const y = (r - 8) * (Math.sqrt(3) / 2);
        const id = `${r}_${c}`;
        const node = { id, r, c, x, y };
        NODES.push(node);
        NODE_MAP[id] = node;
      }
    }

    const CAMPS = { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [] };
    for (let r = 0; r <= 3; r++) for (let c = 0; c < ROW_SIZES[r]; c++) CAMPS[0].push(`${r}_${c}`);
    for (let r = 13; r <= 16; r++) for (let c = 0; c < ROW_SIZES[r]; c++) CAMPS[3].push(`${r}_${c}`);
    for (let r = 4; r <= 7; r++) {
      const w = 4 - (r - 4); const n = ROW_SIZES[r];
      for (let c = 0; c < w; c++) CAMPS[5].push(`${r}_${c}`);
      for (let c = n - w; c < n; c++) CAMPS[1].push(`${r}_${c}`);
    }
    for (let r = 9; r <= 12; r++) {
      const w = 1 + (r - 9); const n = ROW_SIZES[r];
      for (let c = 0; c < w; c++) CAMPS[4].push(`${r}_${c}`);
      for (let c = n - w; c < n; c++) CAMPS[2].push(`${r}_${c}`);
    }

    const NODE_CAMP_MAP = {};
    for (let cid = 0; cid < 6; cid++) {
      for (const id of CAMPS[cid]) NODE_CAMP_MAP[id] = cid;
    }

    const NEIGHBORS = {};
    const NEIGHBOR_IN_DIR = {};
    for (const n1 of NODES) {
      NEIGHBORS[n1.id] = [];
      NEIGHBOR_IN_DIR[n1.id] = {};
      for (const n2 of NODES) {
        if (n1.id === n2.id) continue;
        const dx = n2.x - n1.x;
        const dy = n2.y - n1.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (Math.abs(dist - 1.0) < 0.05) {
          const angle = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
          const d = Math.round(angle / 60) % 6;
          NEIGHBORS[n1.id].push({ to: n2.id, dir: d });
          NEIGHBOR_IN_DIR[n1.id][d] = n2.id;
        }
      }
    }

    // State Variables
    let currentMode = 'ai';
    let aiDifficulty = 'easy';
    let boardState = {};
    let currentTurn = 1;
    let selectedNodeId = null;
    let availableMoves = [];
    let isAiThinking = false;
    let isAnimating = false;
    let turnCount = 0;
    let history = [];
    let currentPuzzleIdx = 0;

    const PUZZLES = [
      { title: '轻盈一跃', desc: '跳过前方的小伙伴，到达闪光目标点！', board: { '14_0': 1, '13_1': 2 }, active: '14_0', target: '12_2' },
      { title: '双重连跳', desc: '利用两颗棋子搭桥，完成双连跳！', board: { '15_0': 1, '14_0': 2, '12_0': 2 }, active: '15_0', target: '10_0' },
      { title: '三连飞跃', desc: '排成一条走廊，一瞬间横跨半个棋盘！', board: { '16_0': 1, '15_0': 2, '13_0': 2, '11_1': 2 }, active: '16_0', target: '9_2' },
      { title: '五星连珠超级跳', desc: '顺着彩虹桥，一气呵成完成5连跳！', board: { '16_0': 1, '15_1': 2, '13_3': 2, '11_5': 2, '9_7': 2, '7_7': 2 }, active: '16_0', target: '5_7' }
    ];

    function getSvgCoord(x, y) {
      return { cx: 350 + x * 28, cy: 350 + y * 28 };
    }

    function getLegalMoves(fromId, state, targetCampId) {
      const moves = [];
      const start = NODE_MAP[fromId];
      if (!start || !state[fromId]) return moves;

      const isAlreadyInTarget = NODE_CAMP_MAP[fromId] === targetCampId;

      for (const n of NEIGHBORS[fromId]) {
        if (!state[n.to]) {
          if (isAlreadyInTarget && NODE_CAMP_MAP[n.to] !== targetCampId) continue;
          moves.push({ to: n.to, path: [fromId, n.to], isJump: false, hops: 0 });
        }
      }

      const visited = new Set([fromId]);
      const queue = [{ pos: fromId, path: [fromId] }];
      while (queue.length > 0) {
        const { pos, path } = queue.shift();
        for (let d = 0; d < 6; d++) {
          const mid = NEIGHBOR_IN_DIR[pos]?.[d];
          if (mid && state[mid]) {
            const dest = NEIGHBOR_IN_DIR[mid]?.[d];
            if (dest && !state[dest] && !visited.has(dest)) {
              if (isAlreadyInTarget && NODE_CAMP_MAP[dest] !== targetCampId) continue;
              visited.add(dest);
              const newPath = [...path, dest];
              moves.push({ to: dest, path: newPath, isJump: true, hops: newPath.length - 1 });
              queue.push({ pos: dest, path: newPath });
            }
          }
        }
      }
      return moves;
    }

    function initGame() {
      selectedNodeId = null;
      availableMoves = [];
      boardState = {};
      turnCount = 0;
      history = [];
      currentTurn = 1;

      if (currentMode === 'ai' || currentMode === 'twoPlayer') {
        for (const h of CAMPS[3]) boardState[h] = 1; // South
        for (const h of CAMPS[0]) boardState[h] = 2; // North
      } else if (currentMode === 'puzzle') {
        const p = PUZZLES[currentPuzzleIdx];
        boardState = { ...p.board };
      }
      saveHistory();
      renderBoard();
      updateUI();
    }

    function saveHistory() {
      history.push(JSON.stringify({ state: boardState, turn: currentTurn }));
    }

    function undo() {
      if (isAnimating || isAiThinking || history.length <= 1) return;
      if (currentMode === 'ai' && history.length >= 3) {
        history.pop();
        const prev = JSON.parse(history.pop());
        boardState = prev.state;
        currentTurn = prev.turn;
      } else {
        history.pop();
        const prev = JSON.parse(history[history.length - 1]);
        boardState = prev.state;
        currentTurn = prev.turn;
      }
      selectedNodeId = null;
      availableMoves = [];
      renderBoard();
      updateUI();
    }

    async function executeMove(fromId, move) {
      isAnimating = true;
      const pid = boardState[fromId];
      delete boardState[fromId];
      renderBoard();

      // Hop Animation
      const animGroup = document.getElementById('animGroup');
      for (let i = 0; i < move.path.length - 1; i++) {
        const n1 = NODE_MAP[move.path[i]];
        const n2 = NODE_MAP[move.path[i + 1]];
        if (move.isJump) sound.hop(i + 1); else sound.step();

        const duration = move.isJump ? 180 : 130;
        const startTime = performance.now();

        await new Promise(resolve => {
          function frame(now) {
            const elapsed = now - startTime;
            const p = Math.min(1, elapsed / duration);
            const curX = n1.x + (n2.x - n1.x) * p;
            const curY = n1.y + (n2.y - n1.y) * p;
            const arc = move.isJump ? Math.sin(p * Math.PI) * 0.9 : 0;
            const coord = getSvgCoord(curX, curY - arc * 0.6);

            animGroup.innerHTML = `<circle cx="${coord.cx}" cy="${coord.cy}" r="${12.5 * (1 + arc * 0.3)}" fill="url(#grad_${pid})" filter="url(#drop_shadow)" />`;
            if (p < 1) requestAnimationFrame(frame);
            else resolve();
          }
          requestAnimationFrame(frame);
        });
      }
      animGroup.innerHTML = '';
      boardState[move.to] = pid;
      isAnimating = false;
      selectedNodeId = null;
      availableMoves = [];
      turnCount++;
      saveHistory();

      // Check Victory
      if (currentMode === 'puzzle') {
        if (move.to === PUZZLES[currentPuzzleIdx].target) {
          triggerWin('挑战成功！');
          return;
        }
      } else {
        const p1Goals = CAMPS[0].filter(h => boardState[h] === 1).length;
        const p2Goals = CAMPS[3].filter(h => boardState[h] === 2).length;
        if (p1Goals === 10) { triggerWin('红方大获全胜！'); return; }
        if (p2Goals === 10) { triggerWin('蓝方大获全胜！'); return; }
      }

      currentTurn = currentTurn === 1 ? 2 : 1;
      renderBoard();
      updateUI();

      if (currentMode === 'ai' && currentTurn === 2) {
        scheduleAi();
      }
    }

    function scheduleAi() {
      isAiThinking = true;
      updateUI();
      setTimeout(() => {
        const aiMoves = [];
        for (const n of NODES) {
          if (boardState[n.id] === 2) {
            const mList = getLegalMoves(n.id, boardState, 3);
            for (const m of mList) {
              const destNode = NODE_MAP[m.to];
              const score = destNode.y - n.y + (m.isJump ? m.hops * 0.5 : 0);
              aiMoves.push({ from: n.id, move: m, score });
            }
          }
        }
        isAiThinking = false;
        if (aiMoves.length > 0) {
          aiMoves.sort((a, b) => b.score - a.score);
          const pick = aiDifficulty === 'easy' ? aiMoves[Math.floor(Math.random() * Math.min(4, aiMoves.length))] : aiMoves[0];
          executeMove(pick.from, pick.move);
        }
      }, 500);
    }

    function triggerWin(msg) {
      sound.victory();
      confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
      document.getElementById('victoryTitle').innerText = msg;
      document.getElementById('victoryModal').classList.remove('hidden');
    }

    function renderBoard() {
      const g = document.getElementById('holesGroup');
      let html = '';

      for (const node of NODES) {
        const { cx, cy } = getSvgCoord(node.x, node.y);
        const owner = boardState[node.id];
        const isSelected = selectedNodeId === node.id;
        const isLegal = availableMoves.some(m => m.to === node.id);
        const moveOpt = availableMoves.find(m => m.to === node.id);
        const isPuzzleTarget = currentMode === 'puzzle' && node.id === PUZZLES[currentPuzzleIdx].target;

        html += `<g transform="translate(${cx}, ${cy})" onclick="handleClick('${node.id}')" class="cursor-pointer">`;
        html += `<circle cx="0" cy="0" r="13.5" fill="#1e293b" stroke="#475569" stroke-width="2" />`;

        if (isPuzzleTarget) {
          html += `<circle cx="0" cy="0" r="18" fill="none" stroke="#f59e0b" stroke-width="3" class="pulse-ring" />`;
          html += `<text x="0" y="5" text-anchor="middle" font-size="14">⭐</text>`;
        }

        if (isLegal) {
          html += `<circle cx="0" cy="0" r="17" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,3" />`;
          html += `<circle cx="0" cy="0" r="11" fill="#38bdf8" fill-opacity="0.4" />`;
          html += `<g transform="translate(0, -18)">
            <rect x="-16" y="-8" width="32" height="16" rx="8" fill="#0284c7" />
            <text x="0" y="4" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">${moveOpt.hops ? moveOpt.hops + '跳' : '1步'}</text>
          </g>`;
        }

        if (owner) {
          html += `<g filter="url(#drop_shadow)">`;
          if (isSelected) {
            html += `<circle cx="0" cy="0" r="16.5" fill="none" stroke="#ffffff" stroke-width="2.5" class="pulse-ring" />`;
          }
          html += `<circle cx="0" cy="0" r="12.5" fill="url(#grad_${owner})" stroke="${owner === 1 ? '#991b1b' : '#1e3a8a'}" stroke-width="1.5" />`;
          html += `<ellipse cx="-4" cy="-4" rx="3.5" ry="2" fill="#ffffff" fill-opacity="0.8" transform="rotate(-30, -4, -4)" />`;
          html += `</g>`;
        }
        html += `</g>`;
      }
      g.innerHTML = html;
    }

    function handleClick(id) {
      if (isAnimating || isAiThinking) return;
      const owner = boardState[id];

      if (owner === currentTurn) {
        selectedNodeId = id;
        availableMoves = getLegalMoves(id, boardState, currentTurn === 1 ? 0 : 3);
        sound.select();
        renderBoard();
        return;
      }

      if (selectedNodeId) {
        const m = availableMoves.find(opt => opt.to === id);
        if (m) {
          executeMove(selectedNodeId, m);
        } else {
          selectedNodeId = null;
          availableMoves = [];
          renderBoard();
        }
      }
    }

    function updateUI() {
      document.getElementById('turnCounter').innerText = `已走: ${turnCount} 回合`;
      const p1Goals = CAMPS[0].filter(h => boardState[h] === 1).length;
      const p2Goals = CAMPS[3].filter(h => boardState[h] === 2).length;
      document.getElementById('p1GoalText').innerText = `${p1Goals}/10`;
      document.getElementById('p2GoalText').innerText = `${p2Goals}/10`;

      const card = document.getElementById('turnCard');
      const avatar = document.getElementById('playerAvatar');
      const name = document.getElementById('playerName');

      if (currentTurn === 1) {
        card.className = "flex items-center gap-3 p-2.5 rounded-xl border border-red-500/40 bg-red-500/10";
        avatar.className = "w-10 h-10 rounded-full bg-red-500 border-2 border-red-300 flex items-center justify-center text-xl shadow-lg";
        avatar.innerText = "👦";
        name.innerText = "你 (红玛瑙)";
      } else {
        card.className = "flex items-center gap-3 p-2.5 rounded-xl border border-blue-500/40 bg-blue-500/10";
        avatar.className = "w-10 h-10 rounded-full bg-blue-500 border-2 border-blue-300 flex items-center justify-center text-xl shadow-lg";
        avatar.innerText = currentMode === 'ai' ? '🐼' : '🔵';
        name.innerText = currentMode === 'ai' ? (isAiThinking ? '🐼 思考跳跃中...' : '🐼 萌宝小贝') : '玩家2 (蓝方)';
      }
    }

    function setAiDiff(d) {
      aiDifficulty = d;
      document.getElementById('btnDiffEasy').className = d === 'easy' ? 'py-1.5 rounded-xl text-xs font-bold border bg-blue-500/30 border-blue-400 text-blue-200' : 'py-1.5 rounded-xl text-xs font-bold border bg-white/5 border-white/10 text-slate-400';
      document.getElementById('btnDiffMed').className = d === 'medium' ? 'py-1.5 rounded-xl text-xs font-bold border bg-purple-500/30 border-purple-400 text-purple-200' : 'py-1.5 rounded-xl text-xs font-bold border bg-white/5 border-white/10 text-slate-400';
      document.getElementById('btnDiffHard').className = d === 'hard' ? 'py-1.5 rounded-xl text-xs font-bold border bg-rose-500/30 border-rose-400 text-rose-200' : 'py-1.5 rounded-xl text-xs font-bold border bg-white/5 border-white/10 text-slate-400';
      document.getElementById('aiDiffLabel').innerText = d === 'easy' ? '🐼 萌宝 (简单)' : d === 'medium' ? '🦊 小狐 (中等)' : '🐉 龙龙 (大师)';
      initGame();
    }

    function restartGame() {
      document.getElementById('victoryModal').classList.add('hidden');
      initGame();
    }

    // Event Listeners
    document.getElementById('btnUndo').onclick = undo;
    document.getElementById('btnRestart').onclick = initGame;
    document.getElementById('btnRules').onclick = () => document.getElementById('rulesModal').classList.remove('hidden');
    document.getElementById('btnSound').onclick = () => {
      sound.muted = !sound.muted;
      document.getElementById('btnSound').innerText = sound.muted ? '🔇' : '🔊';
    };
    document.getElementById('btnHint').onclick = () => {
      if (isAnimating || isAiThinking) return;
      for (const n of NODES) {
        if (boardState[n.id] === currentTurn) {
          const mList = getLegalMoves(n.id, boardState, currentTurn === 1 ? 0 : 3);
          const forward = mList.filter(m => (currentTurn === 1 ? NODE_MAP[m.to].y < n.y : NODE_MAP[m.to].y > n.y));
          if (forward.length > 0) {
            forward.sort((a, b) => b.hops - a.hops);
            selectedNodeId = n.id;
            availableMoves = mList;
            sound.select();
            renderBoard();
            break;
          }
        }
      }
    };

    // Mode Switchers
    document.getElementById('tabAi').onclick = () => {
      currentMode = 'ai';
      document.getElementById('tabAi').className = 'py-2 px-1 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-white shadow-lg';
      document.getElementById('tab2P').className = 'py-2 px-1 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-slate-200';
      document.getElementById('tabPuzzle').className = 'py-2 px-1 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-slate-200';
      document.getElementById('aiDiffSection').classList.remove('hidden');
      document.getElementById('puzzleSection').classList.add('hidden');
      initGame();
    };

    document.getElementById('tab2P').onclick = () => {
      currentMode = 'twoPlayer';
      document.getElementById('tabAi').className = 'py-2 px-1 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-slate-200';
      document.getElementById('tab2P').className = 'py-2 px-1 rounded-xl text-xs font-bold transition-all bg-purple-600 text-white shadow-lg';
      document.getElementById('tabPuzzle').className = 'py-2 px-1 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-slate-200';
      document.getElementById('aiDiffSection').classList.add('hidden');
      document.getElementById('puzzleSection').classList.add('hidden');
      initGame();
    };

    document.getElementById('tabPuzzle').onclick = () => {
      currentMode = 'puzzle';
      document.getElementById('tabAi').className = 'py-2 px-1 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-slate-200';
      document.getElementById('tab2P').className = 'py-2 px-1 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-slate-200';
      document.getElementById('tabPuzzle').className = 'py-2 px-1 rounded-xl text-xs font-bold transition-all bg-amber-500 text-white shadow-lg';
      document.getElementById('aiDiffSection').classList.add('hidden');
      document.getElementById('puzzleSection').classList.remove('hidden');
      loadPuzzleButtons();
      initGame();
    };

    function loadPuzzleButtons() {
      const container = document.getElementById('puzzleLevelBtns');
      container.innerHTML = PUZZLES.map((p, idx) => `
        <button onclick="selectPuzzle(${idx})" class="w-8 h-8 shrink-0 rounded-xl font-black text-xs flex items-center justify-center border ${currentPuzzleIdx === idx ? 'bg-amber-400 text-slate-950 border-amber-300' : 'bg-white/10 text-white border-white/10'}">
          ${idx + 1}
        </button>
      `).join('');
      document.getElementById('puzzleTitle').innerText = PUZZLES[currentPuzzleIdx].title;
      document.getElementById('puzzleDesc').innerText = PUZZLES[currentPuzzleIdx].desc;
    }

    window.selectPuzzle = function(idx) {
      currentPuzzleIdx = idx;
      loadPuzzleButtons();
      initGame();
    };

    initGame();
  </script>
</body>
</html>
